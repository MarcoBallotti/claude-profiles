name: Build and test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS Apple Silicon
            args: --mac --arm64
            artifact: macos-arm64
          - os: macos-latest
            name: macOS Intel
            args: --mac --x64
            artifact: macos-x64
          - os: windows-latest
            name: Windows x64
            args: --win --x64
            artifact: windows-x64
          - os: ubuntu-24.04
            name: Linux x64
            args: --linux --x64
            artifact: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Package
        shell: bash
        env:
          BUILD_ARGS: ${{ matrix.args }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CSC_FOR_PULL_REQUEST: 'true'
        run: |
          read -r -a args <<< "$BUILD_ARGS"
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main && "$RUNNER_OS" == macOS ]]; then
            build="$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT"
            npm run dist -- "${args[@]}" "-c.buildVersion=1.$build" "-c.extraMetadata.mainBuild=$GITHUB_RUN_NUMBER-$GITHUB_RUN_ATTEMPT"
            for archive in dist/*.zip; do
              mv "$archive" "${archive/-mac-/-main-$build-mac-}"
            done
          else
            npm run dist -- "${args[@]}"
          fi
      - name: Verify macOS bundle signatures
        if: runner.os == 'macOS'
        run: |
          for application in dist/mac*/"Claude Profiles.app"; do
            codesign --verify --deep --strict -R '=identifier "io.github.marcoballotti.claudeprofiles"' "$application"
            if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then
              test "$(plutil -extract CFBundleVersion raw -o - "$application/Contents/Info.plist")" = "1.$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT"
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          path: |
            dist/*.zip
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
            dist/*.deb

  release:
    name: Publish preview release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt
      - name: Publish binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag --prerelease --title "Claude Profiles $GITHUB_REF_NAME" --notes-file docs/RELEASE.md

  main-mac-release:
    name: Publish macOS main builds
    if: always() && !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: macos-*
          path: main-assets
          merge-multiple: true
      - name: Publish update archives
        shell: bash
        run: |
          shopt -s nullglob
          arm=(main-assets/*-main-*-mac-arm64.zip)
          intel=(main-assets/*-main-*-mac-x64.zip)
          test "${#arm[@]}" -eq 1 && test "${#intel[@]}" -eq 1 || exit 1
          gh release view main-builds --repo "$GITHUB_REPOSITORY" >/dev/null ||
            gh release create main-builds --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
              --title "Claude Profiles · main builds" --notes "macOS builds for in-app updates." ||
            gh release view main-builds --repo "$GITHUB_REPOSITORY" >/dev/null
          release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/main-builds" --jq .id)
          for archive in "${arm[0]}" "${intel[0]}"; do
            if ! gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" \
              --jq '.[] | select(.state == "uploaded") | .name' | awk -v name="${archive##*/}" '$0 == name { found = 1 } END { exit !found }'; then
              gh release upload main-builds "$archive" --repo "$GITHUB_REPOSITORY"
            fi
          done
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" --slurp |
            jq -r 'flatten | map(select(.state == "uploaded") |
              . + (.name | capture("-main-(?<run>[0-9]+)\\.(?<attempt>[0-9]+)-mac-(?<arch>arm64|x64)\\.zip$"))) |
              group_by(.arch)[] | sort_by([(.run|tonumber), (.attempt|tonumber)]) |
              reverse | .[3:][] | .id' |
            while read -r asset; do
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset" --silent || true
            done
